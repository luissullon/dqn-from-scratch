env_id: CartPole-v1
seed: 0

hidden_sizes: [128, 128]

lr: 0.00025
gamma: 0.99
batch_size: 64
grad_clip_norm: 10.0

buffer_capacity: 100000
min_replay_size: 1000

eps_start: 1.0
eps_end: 0.05
eps_decay_steps: 25000

target_update_interval: 1000
use_double_dqn: true

total_steps: 150000
train_frequency: 1
max_episode_steps: 500
log_interval: 10

device: auto
checkpoint_dir: checkpoints
checkpoint_interval: 25000
